<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أحداث تيك توك</title>
    <style>
        body { background: transparent; color: #fff; font-family: Tahoma, sans-serif; padding: 10px; margin: 0; }
        .event-item { background: rgba(0,0,0,0.6); padding: 10px; margin-bottom: 8px; border-radius: 8px; border-right: 4px solid #00f2fe; }

    </script>
</body>
</html>
